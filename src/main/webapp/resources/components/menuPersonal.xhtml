<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:cc="jakarta.faces.composite"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html">
<cc:interface>
    <cc:attribute name="opcion" type="java.lang.String" default=""/>
</cc:interface>
<cc:implementation>
    <ui:fragment rendered="#{sessionScope.rol eq 'Administrador' or sessionScope.rol eq 'ADMIN'}">
        <li class="menu-desplegable #{cc.attrs.opcion eq 'listarPersonal' or cc.attrs.opcion eq 'nuevoPersonal' ? 'abierto' : ''}" id="menuPersonal">
            <a href="#" class="menu-enlace" onclick="toggleSubmenu(event, 'submenuPersonal')"
               aria-expanded="#{cc.attrs.opcion eq 'listarPersonal' or cc.attrs.opcion eq 'nuevoPersonal'}">
                <i class="fa-solid fa-id-badge"></i><span>Personal</span>
                <i class="fa-solid fa-chevron-down flecha-submenu"></i>
            </a>
            <ul class="submenu" id="submenuPersonal">
                <li class="#{cc.attrs.opcion eq 'listarPersonal' ? 'submenu-activo' : ''}">
                    <h:link outcome="/ListaPersonal.xhtml"><i class="fa-solid fa-list"></i><span>Ver Personal</span></h:link>
                </li>
                <li class="#{cc.attrs.opcion eq 'nuevoPersonal' ? 'submenu-activo' : ''}">
                    <h:link outcome="/personal.xhtml"><i class="fa-solid fa-user-plus"></i><span>Registrar Personal</span></h:link>
                </li>
            </ul>
        </li>
    </ui:fragment>
</cc:implementation>
</html>
